name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      - name: JavaScript parses without a build step
        run: for file in editor/src/rulegrid_editor/static/*.js; do node --check "$file"; done
      - name: Generated files are current
        run: |
          uv run python scripts/refresh.py
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - run: uv build --all-packages
      - name: Installed wheels include examples and editor assets
        run: |
          uv venv "$RUNNER_TEMP/wheels"
          echo "rulegrid @ file://$(realpath dist/rulegrid-*.whl)" > "$RUNNER_TEMP/overrides.txt"
          uv pip install --python "$RUNNER_TEMP/wheels/bin/python" --overrides "$RUNNER_TEMP/overrides.txt" dist/*.whl
          "$RUNNER_TEMP/wheels/bin/rulegrid-editor" --help
          "$RUNNER_TEMP/wheels/bin/python" - <<'PY'
          from importlib.resources import files
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import rulegrid as rg
          from rulegrid.cli import main
          with TemporaryDirectory() as directory:
              for example in ('three_laws', 'rbr'):
                  destination = Path(directory) / example
                  assert main(['init', str(destination), '--from', example]) == 0
                  policy = rg.load(destination / 'profiles/default')
                  assert rg.check(policy) == []
                  assert rg.render(policy, 'document')
          static = files('rulegrid_editor') / 'static'
          for name in ('app.js', 'index.html', 'vendor/preact.js', 'vendor/htm.js', 'vendor/hooks.js', 'vendor/PREACT-LICENSE', 'vendor/HTM-LICENSE'):
              assert (static / name).is_file(), name
          PY
