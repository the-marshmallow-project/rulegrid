name: Release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.5'
          python-version: '3.13'
      - name: Tag names the package and its version
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            editor-v*) package=rulegrid-editor version=${GITHUB_REF_NAME#editor-v} ;;
            v*) package=rulegrid version=${GITHUB_REF_NAME#v} ;;
            *) echo "Tag rulegrid as vX.Y.Z and rulegrid-editor as editor-vX.Y.Z"; exit 1 ;;
          esac
          test "$version" = "$(uv version --package "$package" --short)"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - run: uv build --package ${{ steps.package.outputs.package }}
      - name: Wheel installs from PyPI dependencies alone
        run: |
          uv venv "$RUNNER_TEMP/check"
          uv pip install --no-config --python "$RUNNER_TEMP/check/bin/python" dist/*.whl
          "$RUNNER_TEMP/check/bin/rulegrid" init "$RUNNER_TEMP/policy"
          "$RUNNER_TEMP/check/bin/rulegrid" check "$RUNNER_TEMP/policy"
          if [ -e "$RUNNER_TEMP/check/bin/rulegrid-editor" ]; then "$RUNNER_TEMP/check/bin/rulegrid-editor" --help; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.build.outputs.package }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
