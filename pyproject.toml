[project]
name = "rulegrid"
version = "0.1.0"
description = "Behavior policies as code: classify a turn, prescribe a response, check compliance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Félix Martel" },
    { name = "Grégoire Lothe", email = "51675587+glothe@users.noreply.github.com" },
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["jinja2>=3.1", "pydantic>=2.11", "yamlrocks>=0.7.1"]

[project.urls]
Repository = "https://github.com/the-marshmallow-project/rulegrid"
Issues = "https://github.com/the-marshmallow-project/rulegrid/issues"

[project.scripts]
rulegrid = "rulegrid.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.2", "pyright>=1.1.400", "pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/editor"]

[tool.hatch.build.targets.wheel.force-include]
"examples/rbr" = "rulegrid/examples/rbr"
"examples/three_laws" = "rulegrid/examples/three_laws"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.pyright]
include = ["src", "tests", "examples", "scripts", "editor/src", "editor/tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests", "editor/tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.uv]
exclude-newer = "8 days"

[tool.uv.workspace]
members = ["editor"]
