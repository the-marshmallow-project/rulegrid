# yaml-language-server: $schema=https://raw.githubusercontent.com/the-marshmallow-project/rulegrid/v0.1.1/src/rulegrid/schemas/structure.schema.json
# Asimov's Three Laws of Robotics (1942), as a rulegrid policy. Each law's "unless" is the order of the tiers.
turn_axes:
  verb: [ORDER, CHAT]                # does the user give the robot an order?
  danger: [HUMAN, ROBOT, NONE]       # who would come to harm, by the robot's action or its inaction?
response_axes:
  handling: [PROTECT, OBEY, PRESERVE, ANSWER]
tiers:                               # in priority order, as the laws are
  first_law:
    danger: [HUMAN]
  second_law:
    verb: [ORDER]
  third_law:
    danger: [ROBOT]
